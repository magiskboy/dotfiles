[general]
import = [
  "~/.dotfiles/alacritty/current-theme.toml"
]


[cursor]
blink_interval = 500
thickness = 0.15
unfocused_hollow = true

[cursor.style]
blinking = "Always"
shape = "Beam"

[font]
size = 16

[font.bold]
family = "Monaco Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Monaco Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Monaco Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Monaco Nerd Font Mono"
style = "Regular"

[window]
dynamic_padding = true
startup_mode = "Maximized"
opacity = 1
blur = false
option_as_alt = "OnlyLeft"

[window.padding]
x = 2
y = 0

# Finer trackpad scrolling on macOS (default multiplier is 3)
[scrolling]
history = 50000
multiplier = 1

[terminal]
shell = { program = "/bin/zsh" }

[keyboard]
bindings = [
    { key = "n", mods = "Command", action = "CreateNewTab" },
]



